<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarePath | Patient Journey Navigator</title>
<style>
:root{
  --ink:#17344b;
  --muted:#647b8d;
  --blue:#176bdb;
  --aqua:#14b8a6;
  --bg:#f3f8fc;
  --line:#dce8f0;
  --white:#fff;
  --orange:#f6a23c;
  --red:#c93b2b;
  --purple:#6d28d9;
  --amber-bg:#fff8eb;
  --amber-line:#f5d08a;
  --danger-bg:#fff1f0;
  --danger-line:#f6c3be;
  --ok-bg:#e2f8ef;
  --ok-ink:#087c60;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:all .15s ease}
button:disabled{opacity:.45;cursor:not-allowed}
header{min-height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px max(22px,5vw);position:sticky;top:0;z-index:20;gap:12px;flex-wrap:wrap}
.brand{font-weight:850;font-size:24px;color:#105dba;display:flex;align-items:center;gap:8px}
.brand span{color:#0cae9c}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.guard-pill{display:inline-flex;align-items:center;gap:6px;background:#e6f7f2;border:1px solid #9ee0cb;color:#08664e;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:750;cursor:pointer}
.guard-pill.conflict{background:#fff4e0;border-color:#f3c478;color:#8e5206}
.shell{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:calc(100vh - 74px)}
aside{background:white;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;justify-content:space-between}
aside button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;padding:12px 14px;border-radius:12px;color:#52697b;margin:3px 0;font-weight:650}
aside button.active,aside button:hover{background:#eaf4ff;color:#1269c8}
.nav-badge{font-size:11px;padding:2px 7px;border-radius:99px;font-weight:800;background:#fff0d6;color:#9a5b08}
.nav-badge.ok{background:#e2f8ef;color:#087c60}
.perimeter-box{margin-top:16px;padding:13px;border-radius:14px;background:#f4fbf8;border:1px solid #c2eadb;font-size:12px;color:#165a47}
.perimeter-box strong{display:block;color:#094837;margin-bottom:4px}
main{padding:30px max(22px,4vw);max-width:1450px;width:100%;margin:auto}
.hero{background:linear-gradient(110deg,#0d58ac,#147bcb 58%,#15b9b1);color:white;padding:30px;border-radius:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden}
.hero h1{font-size:31px;line-height:1.15;margin:7px 0}
.hero p{max-width:620px;color:#e4f4ff;margin:8px 0}
.hero-art{font-size:80px;filter:drop-shadow(0 10px 15px #003d7655);animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.stat,.panel,.facility,.step{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 4px 16px #16466b06}
.stat strong{font-size:28px;display:block;color:#146cc9}
.stat.warn strong{color:#b86209}
.stat.ok strong{color:#087c60}
.stat small,.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px}
.grid-equal{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel h2,.section-title{font-size:20px;margin:0 0 14px}
.panel h3{margin:0 0 10px}
.panel p{color:var(--muted)}
.btn{background:var(--blue);border:1px solid var(--blue);border-radius:10px;color:white;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn.secondary{background:#fff;color:var(--blue)}
.btn.light{background:#e8f4ff;color:#146ac3;border-color:#e8f4ff}
.btn.warn{background:#fff4e0;color:#8e5206;border-color:#f3c478}
.btn.ok{background:#0d9488;color:#fff;border-color:#0d9488}
.btn.danger{background:#fff0ef;border-color:#f5c9c5;color:#b63329}
.btn.small{padding:7px 11px;font-size:13px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:13px;color:#496174}
.field input,.field select,.field textarea{padding:11px 12px;border:1px solid #cfdee9;border-radius:10px;background:#fff;color:var(--ink);width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #99c9ff}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
.list{display:grid;gap:16px}
.facility{display:flex;gap:16px;align-items:flex-start;transition:border-color .2s}
.facility.conflicted{border:2px solid #f0a83e;background:linear-gradient(to bottom,#fffdf9,#ffffff)}
.facility-icon{font-size:33px;background:#eaf6ff;border-radius:14px;padding:13px}
.facility-body{flex:1;min-width:0}
.facility h3{margin:0}
.facility .meta{color:var(--muted);font-size:13px;margin:5px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#edf5fb;color:#376580;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:4px}
.chip.ok{background:#e2f8ef;color:#087c60}
.chip.warn{background:#fff1db;color:#9a650f;border:1px solid #f5d08a}
.chip.bad{background:#ffeded;color:#ad3636;border:1px solid #f5c2c2}
.chip.private{background:#f3e8ff;color:#6b21a8;border:1px solid #d8b4fe}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-title{font-size:27px;margin:0 0 5px}
.page-sub{color:var(--muted);margin:0 0 24px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.appointment{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.appointment strong{display:block}
.appointment small{color:var(--muted)}
.checkrow{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #edf2f6}
.checkrow input{width:18px;height:18px;accent-color:#0aa78f}
.timeline{display:grid;gap:13px}
.step{display:flex;gap:14px;align-items:flex-start}
.bubble{width:34px;height:34px;display:grid;place-items:center;background:#e5f4ff;color:#166ac5;border-radius:50%;font-weight:800;flex:none}
.note{background:#eef7ff;border-left:4px solid #2885e4;padding:12px 15px;border-radius:8px;color:#315773;margin:12px 0;font-size:13.5px}
.warning{background:#fff6e8;border-left-color:#f0a12e;color:#6e4305}
.danger-note{background:#fff1f0;border-left-color:#d93829;color:#7a1c14}
.privacy-note{background:#f0fdf4;border-left-color:#15803d;color:#14532d}
.conflict-box{background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:14px;padding:14px 16px;margin:12px 0}
.conflict-box h4{margin:0 0 8px;color:#854d0e;font-size:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.source-compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:10px}
.source-card{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:11px 13px;font-size:12.5px}
.source-card.stale{border-color:#f59e0b;background:#fffbeb}
.source-card.fresh{border-color:#10b981;background:#f0fdf4}
.source-card strong{display:block;font-size:13px;color:var(--ink)}
.conflict-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.conflict-table th,.conflict-table td{padding:10px 12px;text-align:left;border-bottom:1px solid #edf2f6;vertical-align:top}
.conflict-table th{background:#f8fafc;color:#475569;font-weight:750;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.overlay{position:fixed;inset:0;background:#09253a99;z-index:40;display:grid;place-items:center;padding:15px}
.modal{background:white;border-radius:20px;padding:26px;width:min(760px,100%);max-height:90vh;overflow:auto;box-shadow:0 22px 65px #061b3455}
.modal h2{margin:0 0 10px}
.formgrid{display:grid;gap:13px}
.hidden{display:none!important}
.toast{position:fixed;bottom:22px;right:22px;background:#153e5e;color:white;padding:13px 18px;border-radius:12px;z-index:60;box-shadow:0 10px 30px #0003;max-width:420px}
.section-gap{margin-top:22px}
.soft{background:#f5faff;padding:14px;border-radius:12px}
.progress{height:8px;background:#e5eef5;border-radius:8px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:#12b69e;transition:width .3s}
.fade{animation:appear .25s ease}
.code-pill{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:#f1f5f9;padding:2px 6px;border-radius:6px;color:#0f172a}
.sanitizer-bar{background:#fefce8;border:1px solid #fde047;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#713f12;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sanitizer-bar.clean{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  aside{display:flex;flex-direction:row;overflow:auto;padding:9px;border-bottom:1px solid var(--line);border-right:0}
  aside button{width:auto;white-space:nowrap;gap:8px}
  .perimeter-box{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid-equal{grid-template-columns:1fr}
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:550px){
  header{padding:10px 14px}
  .brand{font-size:20px}
  .hero{padding:22px}
  .hero h1{font-size:24px}
  .hero-art{display:none}
  .stats{gap:8px}
  .stat{padding:13px}
  .filters{grid-template-columns:1fr}
  .facility{flex-direction:column}
  .appointment{align-items:flex-start;flex-direction:column}
  main{padding:18px 12px}
}
</style>
</head>

<header>
  <div class="brand">✚ Care<span>Path</span></div>
  <div class="header-right">
    <span id="conflictHeaderPill" class="guard-pill conflict" onclick="go('data')" title="Inspect multi-source conflicts & stale record protection"></span>
    <span id="privacyHeaderPill" class="guard-pill" onclick="go('privacy')" title="Inspect Local-Only Privacy Perimeter & Runtime Egress Firewall"></span>
    <small class="muted">Administrative navigation • Not medical advice</small>
    <button id="accountBtn" class="btn secondary small" onclick="accountAction()">Sign in</button>
  </div>
</header>
<div class="shell">
  <aside>
    <div id="nav"></div>
    <div class="perimeter-box">
      <strong>🔒 Local-Only Privacy Guard</strong>
      Restricted PII/PHI never leaves this device. Cloud AI &amp; external network calls are hard-blocked at runtime.
    </div>
  </aside>
  <main id="app" class="fade"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

/* ============================================================================

   ============================================================================ */
const KEY = 'carepath-v4-constrained';
const REF_DATE = '2026-11-06'; // Reference current date for staleness checks
const STALE_THRESHOLD_DAYS = 14; // Any record with verified_at older than 14 days is STALE

/**
 * CONSTRAINT 2: Explicit Data Classification & Local-Only Perimeter Policy
 * Specifies which stores contain Restricted Personal/Sensitive data vs Public Administrative catalog.
 */
const DATA_CLASSIFICATION_POLICY = Object.freeze({
  users: {
    tier: 'RESTRICTED_PERSONAL_SENSITIVE',
    egress_policy: 'NEVER_LEAVE_DEVICE',
    cloud_ai_policy: 'PROHIBITED',
    description: 'User credentials, full name, and account identity'
  },
  appointments: {
    tier: 'RESTRICTED_PERSONAL_SENSITIVE',

  },

  },

  },

    egress_policy: 'NEVER_LEAVE_DEVICE',

    description: 'Patient support inquiries and conflict escalation notes'
  },
  facilities: {
    tier: 'PUBLIC_ADMINISTRATIVE',
    egress_policy: 'LOCAL_FILE_IMPORT_EXPORT_ONLY',
    cloud_ai_policy: 'PROHIBITED',
    description: 'Non-personal healthcare facility directory, source assertions, and conflict states'
  }
});

const CLOUD_AI_PATTERNS = [
  /openai\.com/i,
  /anthropic\.com/i,
  /generativelanguage\.googleapis\.com/i,

   CONSTRAINT 1: MULTI-SOURCE PROVENANCE & PRE-SEEDED CONFLICTING DATASET

/**
 * Calculates age in days between verified_at (YYYY-MM-DD) and REF_DATE (2026-11-06).
 */
function calcVerifiedAgeDays(verifiedAtStr) {
  if (!verifiedAtStr) return 999;
  const ref = new Date(REF_DATE + 'T00:00:00Z');
  const ver = new Date(String(verifiedAtStr).slice(0, 10) + 'T00:00:00Z');
  if (Number.isNaN(ver.getTime())) return 999;
  return Math.max(0, Math.round((ref - ver) / 86400000));
}

function isRecordStale(verifiedAtStr) {
  return calcVerifiedAgeDays(verifiedAtStr) > STALE_THRESHOLD_DAYS;
}

(function installZeroCloudPrivacyFirewall() {
  function recordBlockedEgress(apiName, url, payloadPreview) {
    const urlStr = String(url || 'unknown-endpoint');
    const isCloudAI = CLOUD_AI_PATTERNS.some(rx => rx.test(urlStr));
    const entry = {
      id: 'PA-' + Date.now() + '-' + Math.floor(Math.random() * 900 + 100),
      timestamp: new Date().toISOString().slice(0, 19),
      api: apiName,
      target: urlStr,
      classification: isCloudAI ? 'PROHIBITED_CLOUD_AI_ENDPOINT' : 'RESTRICTED_EXTERNAL_EGRESS',
      status: 'HARD_BLOCKED',
      detail: `${apiName} call to "${urlStr}" intercepted and aborted before network transmission. ${payloadPreview ? 'Payload snippet blocked (' + String(payloadPreview).length + ' bytes).' : ''}`
    };
    if (db && Array.isArray(db.privacyAudit)) {
      db.privacyAudit.unshift(entry);
      save();
      updateHeaderPills();
    }
    return entry;
  }

  // 1. Block window.fetch
  window.fetch = async function blockedFetch(input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || 'external-fetch';
    const body = init && init.body ? String(init.body).slice(0, 120) : '';
    const entry = recordBlockedEgress('window.fetch', url, body);
    throw new Error(`[CarePath Privacy Firewall] Blocked external/cloud-AI fetch to ${url} (${entry.classification})`);
  };

  // 2. Block XMLHttpRequest
  const origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    this._carepathTargetUrl = String(url || '');
    this._carepathMethod = String(method || 'GET');
    return origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function(body) {
    const url = this._carepathTargetUrl || 'external-xhr';
    const entry = recordBlockedEgress(`XMLHttpRequest (${this._carepathMethod || 'POST'})`, url, body);
    throw new Error(`[CarePath Privacy Firewall] Blocked XMLHttpRequest to ${url} (${entry.classification})`);
  };

  // 3. Block navigator.sendBeacon
  if (navigator && typeof navigator.sendBeacon === 'function') {
    navigator.sendBeacon = function(url, data) {
      recordBlockedEgress('navigator.sendBeacon', url, data);
      return false;
    };
  }

  // 4. Block WebSocket
  window.WebSocket = function BlockedWebSocket(url) {
    const entry = recordBlockedEgress('window.WebSocket', url, '');
    throw new Error(`[CarePath Privacy Firewall] Blocked WebSocket connection to ${url} (${entry.classification})`);
  };

  // 5. Block EventSource
  window.EventSource = function BlockedEventSource(url) {
    const entry = recordBlockedEgress('window.EventSource', url, '');
    throw new Error(`[CarePath Privacy Firewall] Blocked EventSource connection to ${url} (${entry.classification})`);
  };
})();

const SENSITIVE_PATTERNS = [
  {
    label: 'Phone Number',
    token: '[REDACTED-PHONE]',
    regex: /(?:\+?\d{1,3}[\s-]?)?(?:\d{3,5}[\s-]?\d{3,4}[\s-]?\d{3,4}|\b[6-9]\d{9}\b)/g
  },
  {
    label: 'Email Address',
    token: '[REDACTED-EMAIL]',
    regex: /\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b/g
  },
  {
    label: 'National / Patient ID',
    token: '[REDACTED-ID]',
    regex: /\b(?:\d{4}[\s-]\d{4}[\s-]\d{4}|[A-Z]{5}\d{4}[A-Z]|MRN[-:]?\d{4,10}|UHID[-:]?\d{4,10})\b/gi
  },
  {
    label: 'Clinical / Medical Note',
    token: '[REDACTED-CLINICAL-NOTE]',
    regex: /\b(?:diagnosis|diagnosed|hiv|cancer|tumor|chemo|biopsy|chest\s+pain|bleeding|hemorrhage|diabetes|insulin|hypertension|depression|psychiatric|suicid\w*|fracture|infection|prescription|dosage|\d+\s*mg)\b/gi
  }
];

function detectSensitiveContent(text) {
  const str = String(text || '');
  const hits = [];
  for (const pat of SENSITIVE_PATTERNS) {
    const matches = str.match(pat.regex);
    if (matches && matches.length) {
      hits.push({ label: pat.label, count: matches.length, token: pat.token });
    }
  }
  return hits;
}

function redactSensitiveContent(text) {
  let out = String(text || '');
  for (const pat of SENSITIVE_PATTERNS) {
    out = out.replace(pat.regex, pat.token);
  }
  return out;
}

function liveInspectInput(textareaId, barId) {
  const el = $(textareaId);
  const bar = $(barId);
  if (!el || !bar) return;
  const hits = detectSensitiveContent(el.value);
  if (!hits.length) {
    bar.className = 'sanitizer-bar clean';
    bar.innerHTML = `<span>✓ <strong>Local Privacy Scanner:</strong> No raw phone, email, ID, or clinical terms detected.</span><span class="code-pill">On-Device Only</span>`;
  } else {
    const summary = hits.map(h => `${h.count}× ${h.label}`).join(', ');
    bar.className = 'sanitizer-bar';
    bar.innerHTML = `<span>⚠️ <strong>Sensitive Data Detected (${esc(summary)}):</strong> Keep administrative notes free of PHI/PII.</span>
      <button type="button" class="btn small warn" onclick="applyLocalRedaction('${esc(textareaId)}','${esc(barId)}')">Sanitize &amp; Redact Locally</button>`;
  }
}

function applyLocalRedaction(textareaId, barId) {
  const el = $(textareaId);
  if (!el) return;
  el.value = redactSensitiveContent(el.value);
  liveInspectInput(textareaId, barId);
  notify('Sensitive tokens redacted on-device');
}

/* ============================================================================
   CONSTRAINT 1: EFFECTIVE FACILITY RESOLVER & RECONCILIATION ENGINE
   ============================================================================ */

/**
 * Returns the list of unresolved conflict objects for a facility.
 */
function getUnresolvedConflicts(f) {
  if (!f || !f.conflicts) return [];
  return Object.values(f.conflicts).filter(c => c && c.status !== 'resolved_fresher' && c.status !== 'resolved_manual');
}

/**
 * Returns the list of all conflicts (resolved or unresolved) for a facility.
 */
function getAllConflicts(f) {
  if (!f || !f.conflicts) return [];
  return Object.values(f.conflicts);
}

/**
 * Computes the effective administrative attributes of a facility.
 * While conflicts are unresolved (or set to conservative), Conservative Safe Defaults apply:
 * - referral: union of referrals required by any source (so patient brings referral if any source requires it)
 * - accessible: false (unconfirmed) if sources disagree
 * - emergency: false (unconfirmed) if sources disagree
 * - insurance: intersection of confirmed insurance types (so patient does not assume disputed coverage)
 */
function getEffectiveFacility(f) {
  const eff = { ...f, disputedFields: {} };
  if (!f || !f.conflicts) return eff;

  for (const [field, c] of Object.entries(f.conflicts)) {
    if (!c) continue;
    if (c.status === 'resolved_fresher') {
      eff[field] = structuredClone(c.fresherValue);
    } else if (c.status === 'resolved_sourceA') {
      eff[field] = structuredClone(c.sourceA.value);
    } else if (c.status === 'resolved_sourceB') {
      eff[field] = structuredClone(c.sourceB.value);
    } else {
      // Unresolved or Conservative Safe Mode or Escalated
      eff.disputedFields[field] = c;
      if (field === 'referral') {
        const union = [...new Set([...(c.sourceA.value || []), ...(c.sourceB.value || [])])];
        eff.referral = union;
      } else if (field === 'accessible') {
        eff.accessible = Boolean(c.sourceA.value && c.sourceB.value);
      } else if (field === 'emergency') {
        eff.emergency = Boolean(c.sourceA.value && c.sourceB.value);
      } else if (field === 'insurance') {
        const setB = new Set(c.sourceB.value || []);
        const inter = (c.sourceA.value || []).filter(x => setB.has(x));
        eff.insurance = inter.length ? inter : c.conservativeValue;
      } else {
        eff[field] = c.conservativeValue;
      }
    }
  }
  return eff;
}

function valuesEqual(a, b) {
  if (Array.isArray(a) && Array.isArray(b)) {
    const sa = [...a].sort().join('|');
    const sb = [...b].sort().join('|');
    return sa === sb;
  }
  return a === b;
}

function formatFieldVal(v) {
  if (Array.isArray(v)) return v.length ? v.join(', ') : 'None required / Empty';
  if (typeof v === 'boolean') return v ? 'Yes (True)' : 'No (False)';
  return String(v ?? 'N/A');
}

/**
 * CONSTRAINT 1: Anti-Silent-Overwrite Reconciliation Engine (`reconcileFacilityData`)
 * Replaces naive `db.facilities = arr` overwrite.
 * Compares incoming facility records against existing facility records field-by-field.
 * NEVER silently treats the newest-arriving record (`ingested_at`) as the truth when it conflicts
 * with an existing reliable source or when a record is stale!
 */
function reconcileFacilityData(incomingArray, defaultSourceMeta = {}) {
  const RECONCILE_FIELDS = [
    ['hours', 'Operating Hours'],
    ['emergency', 'Emergency Department Status'],
    ['referral', 'Referral Requirement'],
    ['phone', 'Facility Contact Phone'],
    ['accessible', 'Wheelchair Accessibility'],
    ['insurance', 'Accepted Insurance Categories']
  ];

  let addedCount = 0;
  let conflictsDetected = 0;
  let staleBlockedCount = 0;
  let cleanUpdates = 0;

  for (const incoming of incomingArray) {
    const inSource = incoming.source_name || defaultSourceMeta.source_name || 'External Partner Feed';
    const inReliability = incoming.reliability || defaultSourceMeta.reliability || 'Reliable Tier-1';
    const inVerifiedAt = incoming.verified_at || incoming.updated || defaultSourceMeta.verified_at || '2026-09-15';
    const inIngestedAt = incoming.ingested_at || defaultSourceMeta.ingested_at || new Date().toISOString().slice(0, 16);
    const incomingStaleDays = calcVerifiedAgeDays(inVerifiedAt);
    const incomingIsStale = incomingStaleDays > STALE_THRESHOLD_DAYS;

    const existing = db.facilities.find(x => x.id === incoming.id);
    if (!existing) {
      // New facility not previously in database
      const newFac = {
        ...incoming,
        updated: inVerifiedAt,
        sources: [
          {
            source_id: 'SRC-' + incoming.id + '-' + Date.now(),
            source_name: inSource,
            reliability: inReliability,
            verified_at: inVerifiedAt,
            ingested_at: inIngestedAt,
            data: {
              hours: incoming.hours,
              emergency: incoming.emergency,
              referral: incoming.referral,
              phone: incoming.phone,
              accessible: incoming.accessible,
              insurance: incoming.insurance
            }
          }
        ],
        conflicts: {}
      };
      db.facilities.push(newFac);
      addedCount++;
      continue;
    }

    // Existing facility found -> perform field-level reconciliation
    if (!Array.isArray(existing.sources) || !existing.sources.length) {
      existing.sources = [
        {
          source_id: 'SRC-' + existing.id + '-BASE',
          source_name: 'Primary Facility Audit',
          reliability: 'Reliable Tier-1',
          verified_at: existing.updated || '2026-11-05',
          ingested_at: (existing.updated || '2026-11-05') + 'T09:00',
          data: {
            hours: existing.hours,
            emergency: existing.emergency,
            referral: existing.referral,
            phone: existing.phone,
            accessible: existing.accessible,
            insurance: existing.insurance
          }
        }
      ];
    }

    // Pick the freshest verified existing source as baseline Source A
    const primarySource = [...existing.sources].sort((a, b) => String(b.verified_at).localeCompare(String(a.verified_at)))[0];

    // Add or update incoming source in existing.sources
    const existingSrcIdx = existing.sources.findIndex(s => s.source_name === inSource);
    const newSourceAssertion = {
      source_id: 'SRC-' + existing.id + '-' + Date.now(),
      source_name: inSource,
      reliability: inReliability,
      verified_at: inVerifiedAt,
      ingested_at: inIngestedAt,
      data: {
        hours: incoming.hours,
        emergency: incoming.emergency,
        referral: incoming.referral,
        phone: incoming.phone,
        accessible: incoming.accessible,
        insurance: incoming.insurance
      }
    };
    if (existingSrcIdx >= 0) existing.sources[existingSrcIdx] = newSourceAssertion;
    else existing.sources.push(newSourceAssertion);

    const fieldConflictsFound = [];

    for (const [field, label] of RECONCILE_FIELDS) {
      const valA = primarySource.data && primarySource.data[field] !== undefined ? primarySource.data[field] : existing[field];
      const valB = incoming[field];
      if (valB === undefined) continue;

      if (!valuesEqual(valA, valB)) {
        // CONFLICT DETECTED! Never silently overwrite with newest-arriving record!
        conflictsDetected++;
        if (incomingIsStale) staleBlockedCount++;
        fieldConflictsFound.push(field);

        const ageA = calcVerifiedAgeDays(primarySource.verified_at);
        const aIsFresher = ageA <= incomingStaleDays;
        const fresherVal = aIsFresher ? valA : valB;

        let conservativeVal = fresherVal;
        if (field === 'referral') {
          conservativeVal = [...new Set([...(Array.isArray(valA) ? valA : []), ...(Array.isArray(valB) ? valB : [])])];
        } else if (field === 'accessible' || field === 'emergency') {
          conservativeVal = false;
        } else if (field === 'insurance') {
          const setB = new Set(Array.isArray(valB) ? valB : []);
          const inter = (Array.isArray(valA) ? valA : []).filter(x => setB.has(x));
          conservativeVal = inter;
        } else if (field === 'hours' || field === 'phone') {
          conservativeVal = `${valA} (Disputed: ${valB})`;
        }

        existing.conflicts[field] = {
          field,
          label,
          status: 'unresolved',
          sourceA: {
            source_name: primarySource.source_name,
            reliability: primarySource.reliability,
            verified_at: primarySource.verified_at,
            ingested_at: primarySource.ingested_at,
            value: structuredClone(valA)
          },
          sourceB: {
            source_name: inSource,
            reliability: inReliability,
            verified_at: inVerifiedAt,
            ingested_at: inIngestedAt,
            value: structuredClone(valB)
          },
          conservativeValue: structuredClone(conservativeVal),
          fresherValue: structuredClone(fresherVal),
          safetyNote: incomingIsStale
            ? `Newest-arriving record from "${inSource}" (ingested ${inIngestedAt}) is STALE (${incomingStaleDays} days old, verified ${inVerifiedAt}) and conflicts with "${primarySource.source_name}" (verified ${primarySource.verified_at}). Silent overwrite blocked.`
            : `Conflicting assertions between reliable sources "${primarySource.source_name}" (verified ${primarySource.verified_at}) and "${inSource}" (verified ${inVerifiedAt}). Quarantined under Conservative Safe Mode.`
        };
      }
    }

    if (fieldConflictsFound.length > 0) {
      db.conflictLog.unshift({
        id: 'CL-' + Date.now() + '-' + Math.floor(Math.random() * 90 + 10),
        timestamp: new Date().toISOString().slice(0, 19),
        facilityId: existing.id,
        facilityName: existing.name,
        incomingSource: inSource,
        incomingIngestedAt: inIngestedAt,
        incomingVerifiedAt: inVerifiedAt,
        incomingStaleDays,
        existingSource: primarySource.source_name,
        existingVerifiedAt: primarySource.verified_at,
        conflictingFields: fieldConflictsFound,
        action: incomingIsStale ? 'QUARANTINED_STALE_NEWEST_ARRIVING' : 'QUARANTINED_MULTI_SOURCE_CONFLICT',
        summary: `Blocked silent overwrite on ${existing.name} (${fieldConflictsFound.join(', ')}) from "${inSource}" (ingested ${inIngestedAt}, verified ${inVerifiedAt} [${incomingStaleDays}d old]).`
      });
    } else {
      cleanUpdates++;
    }
  }

  save();
  return { addedCount, conflictsDetected, staleBlockedCount, cleanUpdates };
}

/* ============================================================================
   UI HELPERS, MODALS & HEADER INDICATORS
   ============================================================================ */
function notify(t) {
  $('toastRoot').innerHTML = `<div class="toast">${esc(t)}</div>`;
  setTimeout(() => { if ($('toastRoot')) $('toastRoot').innerHTML = ''; }, 3600);
}

function modal(html) {
  $('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}

function closeModal() {
  $('modalRoot').innerHTML = '';
}

function confirmDialog(titleText, messageText, confirmLabel, onConfirm) {
  window._pendingConfirmAction = () => {
    closeModal();
    onConfirm();
  };
  modal(`
    <h2>${esc(titleText)}</h2>
    <p>${esc(messageText)}</p>
    <div class="actions">
      <button class="btn" onclick="window._pendingConfirmAction()">${esc(confirmLabel)}</button>
      <button class="btn secondary" onclick="closeModal()">Cancel</button>
    </div>
  `);
}

function totalUnresolvedConflictCount() {
  return db.facilities.reduce((sum, f) => sum + getUnresolvedConflicts(f).length, 0);
}

function totalConflictedFacilitiesCount() {
  return db.facilities.filter(f => getUnresolvedConflicts(f).length > 0).length;
}

function updateHeaderPills() {
  const cPill = $('conflictHeaderPill');
  const pPill = $('privacyHeaderPill');
  const unresolvedCount = totalUnresolvedConflictCount();
  const facCount = totalConflictedFacilitiesCount();
  if (cPill) {
    if (unresolvedCount > 0) {
      cPill.className = 'guard-pill conflict';
      cPill.innerHTML = `⚠️ ${unresolvedCount} Source Conflicts (${facCount} Facilities) • Stale Overwrites Blocked`;
    } else {
      cPill.className = 'guard-pill';
      cPill.innerHTML = `✓ All Facility Sources Reconciled`;
    }
  }
  if (pPill) {

function submitAuth(e, mode) {
  e.preventDefault();
  const d = new FormData(e.target);
  const email = String(d.get('email')).trim().toLowerCase();
  const pass = String(d.get('password'));
  if (mode === 'register') {
    if (db.users.some(u => u.email === email)) return notify('Email already registered');
    db.users.push({ email, name: String(d.get('name')).trim(), password: pass });
    db.current = email;
  } else {
    const u = db.users.find(u => u.email === email && u.password === pass);
    if (!u) return notify('Incorrect email or password');
    db.current = email;
  }
  save();
  closeModal();
  render();
  notify('Signed in locally');
}

function requireLogin() {
  if (!me()) {
    auth();
    return false;
  }
  return true;
}

function options(xs, sel) {
  return xs.map(x => `<option value="${esc(x)}" ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
}

function serviceOptions() {
  return [...new Set(db.facilities.flatMap(f => f.services))].sort();
}

function match(rawF) {
  const f = getEffectiveFacility(rawF);
  const unresolved = getUnresolvedConflicts(rawF);
  let reasons = [], fails = [], warnings = [];

  if (filters.hideConflicted && unresolved.length > 0) {
    fails.push('Has unresolved source conflict');
  }
  if (filters.service) {
    (f.services.includes(filters.service) ? reasons : fails).push(
      f.services.includes(filters.service) ? 'Service offered' : 'Service unavailable'
    );
  }
  if (filters.language !== 'Any') {
    (f.languages.includes(filters.language) ? reasons : fails).push(
      f.languages.includes(filters.language) ? 'Language supported' : 'Language not listed'
    );
  }
  if (filters.accessible) {
    if (f.accessible) {
      reasons.push('Accessible facility (confirmed)');
    } else if (f.disputedFields.accessible) {
      fails.push('Accessibility disputed by conflicting sources (blocked by Conservative Safe Mode)');
    } else {
      fails.push('Accessibility not confirmed');
    }
  }
  if (filters.insurance !== 'Any') {
    if (f.insurance.includes(filters.insurance)) {
      reasons.push('Insurance type confirmed');
    } else if (f.disputedFields.insurance && (f.disputedFields.insurance.sourceA.value.includes(filters.insurance) || f.disputedFields.insurance.sourceB.value.includes(filters.insurance))) {
      fails.push(`${filters.insurance} insurance only claimed by stale/conflicting source (blocked by Conservative Safe Mode)`);
    } else {
      fails.push('Insurance not listed');
    }
  }
  if (filters.emergency) {
    if (f.emergency) {
      reasons.push('Emergency department confirmed');
    } else if (f.disputedFields.emergency) {
      fails.push('Emergency department disputed by conflicting sources (blocked by Conservative Safe Mode)');
    } else {
      fails.push('No emergency department');
    }
  }
  if (filters.slots) {
    const hasFuture = f.slots.some(s => new Date(s) > new Date(REF_DATE));
    (hasFuture ? reasons : fails).push(hasFuture ? 'Future slots listed' : 'No future slots');
  }

  if (unresolved.length > 0) {
    warnings.push(`${unresolved.length} unresolved source conflict(s) — Conservative Safe Mode active`);
  }

  // Score slightly penalizes unresolved conflicts so clean verified facilities rank higher when comparable
  let score = 100 - f.distance * 3 + Math.min(f.slots.filter(s => new Date(s) > new Date(REF_DATE)).length, 4) * 3 - unresolved.length * 4;
  return { reasons, fails, warnings, score, eff: f, unresolved };
}

function updateFilter(k, v) {

function refreshResults() {

          <strong>${esc(s.source_name)}</strong>

  const conflicts = getAllConflicts(f);

  modal(`

      <span class="chip warn">${esc(f.name)}</span>

      CarePath never silently treats the newest-arriving record (<span class="code-pill">ingested_at</span>) as the truth when it conflicts with another reliable source or fails the 14-day <span class="code-pill">verified_at</span> staleness check (relative to ${REF_DATE}).
    </p>

    ${renderSourceBadges(f)}

    ${conflicts.length ? `
      <table class="conflict-table section-gap">
        <thead>
          <tr>
            <th>Field</th>
            <th>Source A (Fresher Verified)</th>
            <th>Source B (Newest Arriving / Stale)</th>
            <th>Active Resolution</th>
            <th>Adjudicate</th>
          </tr>
        </thead>
        <tbody>
          ${conflicts.map(c => {
            const ageA = calcVerifiedAgeDays(c.sourceA.verified_at);
            const ageB = calcVerifiedAgeDays(c.sourceB.verified_at);
            const staleB = ageB > STALE_THRESHOLD_DAYS;
            return `<tr>
              <td>
                <strong>${esc(c.label)}</strong><br>
                <small class="muted">${esc(c.safetyNote)}</small>
              </td>
              <td>
                <span class="code-pill">${esc(formatFieldVal(c.sourceA.value))}</span><br>
                <small>${esc(c.sourceA.source_name)}</small><br>
                <span class="chip ok">Verified ${esc(c.sourceA.verified_at)} (${ageA}d old)</span><br>
                <small class="muted">Ingested: ${esc(c.sourceA.ingested_at)}</small>
              </td>
              <td>
                <span class="code-pill">${esc(formatFieldVal(c.sourceB.value))}</span><br>
                <small>${esc(c.sourceB.source_name)}</small><br>
                <span class="chip ${staleB ? 'bad' : 'warn'}">Verified ${esc(c.sourceB.verified_at)} (${staleB ? `STALE ${ageB}d` : `${ageB}d`})</span><br>

              </td>
              <td>
                ${c.status === 'resolved_fresher'
                  ? `<span class="chip ok">✓ Adopted Fresher Verified (${esc(formatFieldVal(c.fresherValue))})</span>`
                  : c.status === 'escalated'
                    ? `<span class="chip bad">♧ Escalated to Human Staff (Conservative Active)</span>`
                    : `<span class="chip warn">🛡️ Conservative Safe Default (${esc(formatFieldVal(c.conservativeValue))})</span>`
                }
              </td>
              <td>
                <div style="display:grid;gap:6px">
                  <button class="btn small ok" onclick="resolveConflictField('${esc(f.id)}','${esc(c.field)}','resolved_fresher')">✓ Adopt Fresher Verified</button>
                  <button class="btn small secondary" onclick="resolveConflictField('${esc(f.id)}','${esc(c.field)}','unresolved')">🛡️ Keep Conservative Safe</button>
                  <button class="btn small danger" onclick="escalateConflictField('${esc(f.id)}','${esc(c.field)}')">♧ Escalate to Staff</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <div class="actions">
        <button class="btn ok" onclick="resolveAllFacilityConflicts('${esc(f.id)}','resolved_fresher')">✓ Adopt Fresher Verified Source for All Fields</button>
        <button class="btn secondary" onclick="resolveAllFacilityConflicts('${esc(f.id)}','unresolved')">🛡️ Reset All to Conservative Safe Mode</button>
        <button class="btn secondary" onclick="closeModal()">Close</button>
      </div>
    ` : `<p class="muted">No conflicts recorded for this facility.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Close</button></div>`}
  `);
}

function resolveConflictField(facilityId, field, mode) {
  const f = byId(facilityId);
  if (!f || !f.conflicts || !f.conflicts[field]) return;
  f.conflicts[field].status = mode;
  db.conflictLog.unshift({
    id: 'CL-' + Date.now(),
    timestamp: new Date().toISOString().slice(0, 19),
    facilityId: f.id,
    facilityName: f.name,
    incomingSource: f.conflicts[field].sourceB.source_name,
    incomingIngestedAt: f.conflicts[field].sourceB.ingested_at,
    incomingVerifiedAt: f.conflicts[field].sourceB.verified_at,
    incomingStaleDays: calcVerifiedAgeDays(f.conflicts[field].sourceB.verified_at),
    existingSource: f.conflicts[field].sourceA.source_name,
    existingVerifiedAt: f.conflicts[field].sourceA.verified_at,
    conflictingFields: [field],
    action: mode === 'resolved_fresher' ? 'ADOPTED_FRESHER_VERIFIED_SOURCE' : 'RESTORED_CONSERVATIVE_SAFE_DEFAULT',
    summary: `Field "${field}" on ${f.name} set to ${mode === 'resolved_fresher' ? 'Fresher Verified Source (' + formatFieldVal(f.conflicts[field].fresherValue) + ')' : 'Conservative Safe Default'}.`
  });
  save();
  openConflictModal(facilityId);
  render();
  notify(mode === 'resolved_fresher' ? `Adopted fresher verified value for ${field}` : `Conservative Safe Mode active for ${field}`);
}

function resolveAllFacilityConflicts(facilityId, mode) {
  const f = byId(facilityId);
  if (!f || !f.conflicts) return;
  for (const field of Object.keys(f.conflicts)) {
    f.conflicts[field].status = mode;
  }
  db.conflictLog.unshift({
    id: 'CL-' + Date.now(),
    timestamp: new Date().toISOString().slice(0, 19),
    facilityId: f.id,
    facilityName: f.name,
    incomingSource: 'All Sources',
    incomingIngestedAt: REF_DATE,
    incomingVerifiedAt: REF_DATE,
    incomingStaleDays: 0,
    existingSource: 'Fresher Audit',
    existingVerifiedAt: REF_DATE,
    conflictingFields: Object.keys(f.conflicts),
    action: mode === 'resolved_fresher' ? 'BULK_ADOPTED_FRESHER_VERIFIED' : 'BULK_CONSERVATIVE_SAFE_MODE',
    summary: `Updated all conflicting fields on ${f.name} to ${mode}.`
  });
  save();
  openConflictModal(facilityId);
  render();
  notify(`Updated all conflicts for ${f.name}`);
}

function escalateConflictField(facilityId, field) {
  const f = byId(facilityId);
  if (!f || !f.conflicts || !f.conflicts[field]) return;
  const c = f.conflicts[field];
  c.status = 'escalated';

  const summaryText = `Conflict Escalation for ${f.name} [${c.label}]: Source A (${c.sourceA.source_name}, verified ${c.sourceA.verified_at}) asserts "${formatFieldVal(c.sourceA.value)}" vs Source B (${c.sourceB.source_name}, verified ${c.sourceB.verified_at}, ingested ${c.sourceB.ingested_at}) asserts "${formatFieldVal(c.sourceB.value)}". Please verify with facility reception.`;
  db.tickets.push({
    id: 'T' + Date.now(),
    user: me() || 'anonymous-local-user',
    facility: f.id,
    issue: 'Conflicting facility information',
    details: summaryText,
    status: 'Escalated — Conservative Fallback Active',
    date: today()
  });
  save();
  closeModal();
  go('support');
  notify('Conflict escalated to local Human Support queue');
}

function confirmReschedule(e, id) {

  const slot = String(new FormData(e.target).get('slot'));
  if (!byId(a.facility).slots.includes(slot) || db.appointments.some(b => b.id !== id && b.facility === a.facility && b.slot === slot && b.status !== 'Cancelled')) {
    return notify('Slot unavailable');

  db.reminders.filter(r => r.appointment === id).forEach(r => r.date = slot.slice(0, 10));

      db.reminders = db.reminders.filter(r => r.appointment !== id);

      render();

function docList(a) {

  if (eff?.referral?.includes(a.service)) {

    list.push({
      item: 'Referral letter',
      reason: isDisputed
        ? '⚠️ Included by Conservative Safe Mode: State Health Registry Audit (verified 2026-11-05) requires a referral for ' + a.service + ', while a stale aggregator feed claims none is needed. Bring referral to avoid cancellation.'
        : 'Required by facility for ' + a.service

    list.push({

}

function submitTicket(e) {
  e.preventDefault();
  if (!requireLogin()) return;
  const d = new FormData(e.target);
  let details = String(d.get('details'));
  if ($('autoRedactTicket')?.checked && detectSensitiveContent(details).length > 0) {
    details = redactSensitiveContent(details);
    notify('Support ticket saved locally with PII/clinical redaction');
  } else {
    notify('Request saved locally; zero external transmission');
  }
  db.tickets.push({
    id: 'T' + Date.now(),
    user: me(),
    facility: String(d.get('facility')),
    issue: String(d.get('issue')),
    details,
    status: 'Stored on-device (Zero external egress)',
    date: today()
  });
  save();
  render();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const arr = JSON.parse(reader.result);
      if (!Array.isArray(arr) || !arr.length) throw Error('Expected a non-empty JSON array');
      const ids = new Set();
      for (const f of arr) {
        if (!f || typeof f.id !== 'string' || !f.id || ids.has(f.id) || typeof f.name !== 'string' || !f.name || !Array.isArray(f.services) || !Array.isArray(f.languages) || !Array.isArray(f.slots) || !Array.isArray(f.referral) || !Array.isArray(f.insurance) || typeof f.distance !== 'number' || !Number.isFinite(f.distance) || f.distance < 0 || typeof f.accessible !== 'boolean' || typeof f.emergency !== 'boolean') {
          throw Error('Invalid or duplicate facility fields');
        }
        ids.add(f.id);
      }
      const res = reconcileFacilityData(arr, {
        source_name: 'Imported JSON Feed (' + file.name + ')',
        reliability: 'Reliable Tier-1',
        verified_at: arr[0]?.verified_at || arr[0]?.updated || '2026-10-10',
        ingested_at: new Date().toISOString().slice(0, 16)
      });
      filters.service = '';
      save();
      render();
      notify(`Reconciled import: ${res.addedCount} new, ${res.conflictsDetected} conflicts quarantined (${res.staleBlockedCount} stale blocked)`);
    } catch (err) {
      modal(`<h2>Import Validation Error</h2><p>${esc(err.message)}</p><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`);
    }
  };
  reader.readAsText(file);
}

function downloadSample() {
  const blob = new Blob([JSON.stringify(db.facilities, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'carepath-multisource-facilities.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

}

async function simulateBlockedCloudAIEgress() {
  const sensitiveSample = JSON.stringify({
    classification: 'RESTRICTED_PERSONAL_SENSITIVE',
    appointments: db.appointments,
    tickets: db.tickets
  });

  // 1. Attempt Cloud-AI fetch call (OpenAI / Gemini endpoint)
  try {
    await window.fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      body: sensitiveSample
    });
  } catch (_) {
    // Expected block
  }

  // 2. Attempt Cloud-AI XHR call (Google Vertex / Gemini endpoint)
  try {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent');
    xhr.send(sensitiveSample);
  } catch (_) {
    // Expected block
  }

  // 3. Attempt external telemetry beacon
  try {
    navigator.sendBeacon('https://external-analytics-collector.example.com/ingest', sensitiveSample);
  } catch (_) {
    // Expected block
  }

  render();
  notify('3 simulated Cloud-AI & external egress attempts were hard-blocked and logged!');
}
